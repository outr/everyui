<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <link rel="icon" type="image/png" href="images/everyui-mark.png">
  <title>EveryUI — render-seam slice</title>
  <style>
    @font-face { font-family: 'Open Sans'; font-weight: 400; src: url(fonts/OpenSans-Regular.ttf) format('truetype'); }
    @font-face { font-family: 'Open Sans'; font-weight: 600; src: url(fonts/OpenSans-SemiBold.ttf) format('truetype'); }
    @font-face { font-family: 'Material Icons'; font-weight: 400; src: url(fonts/MaterialIcons-Regular.ttf) format('truetype'); }
    @font-face { font-family: 'Roboto Mono'; font-weight: 400; src: url(fonts/RobotoMono-Regular.ttf) format('truetype'); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
    #app { width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // an uncaught error reaches the console capture the checks read (tools/check.sh), with its stack
    window.addEventListener("error", e => console.log("[ui] uncaught " + (e.error && e.error.stack ? e.error.stack : e.message)));
    window.addEventListener("unhandledrejection", e => console.log("[ui] uncaught (promise) " + (e.reason && e.reason.stack ? e.reason.stack : e.reason)));
    window.addEventListener("unhandledrejection", e => console.log("[ui] unhandled rejection " + (e.reason && e.reason.stack ? e.reason.stack : e.reason)));
  </script>
  <script src="main.js"></script>
</body>
</html>
