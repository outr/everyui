<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <!-- the E is one silhouette (700 x 775) with two rounded slots; every colour layer is clipped to it -->
    <path id="sil" d="M0,240 C0,108 108,0 240,0 L655,0 C680,0 700,20 700,45 C700,145 640,220 555,220 L245,220 C190,220 190,300 245,300 L555,300 A92.5,92.5 0 0 1 555,485 L245,485 C200,485 200,550 245,550 L535,550 C625,550 700,640 700,730 C700,755 680,775 655,775 L165,775 C74,775 0,701 0,610 Z"/>
    <clipPath id="clip"><use href="#sil"/></clipPath>
    <!-- base shows through in the fold -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3A9CFF"/>
      <stop offset="0.6" stop-color="#5A4FD8"/>
      <stop offset="1"   stop-color="#B84BFF"/>
    </linearGradient>
    <!-- top ribbon: blue at the bottom-left, cyan, mint at the top-right tip -->
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="480" x2="700" y2="0">
      <stop offset="0"    stop-color="#4E6CFF"/>
      <stop offset="0.3"  stop-color="#3FAAFF"/>
      <stop offset="0.65" stop-color="#4AD9FF"/>
      <stop offset="1"    stop-color="#7DFFD6"/>
    </linearGradient>
    <!-- fold back-face: dark navy -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="245" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#151846"/>
      <stop offset="1" stop-color="#2F3399"/>
    </linearGradient>
    <!-- middle bar: indigo at the vertex to violet-pink at the end -->
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="650" y2="0">
      <stop offset="0"    stop-color="#3634A8"/>
      <stop offset="0.35" stop-color="#6A6BFF"/>
      <stop offset="0.75" stop-color="#B06CFF"/>
      <stop offset="1"    stop-color="#D274FF"/>
    </linearGradient>
    <!-- bottom ribbon: purple at the vertex, magenta, coral, yellow at the bottom-right -->
    <linearGradient id="bot" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="700" y2="775">
      <stop offset="0"    stop-color="#8B4BFF"/>
      <stop offset="0.3"  stop-color="#FF5FA5"/>
      <stop offset="0.62" stop-color="#FF8A5C"/>
      <stop offset="1"    stop-color="#FFD84A"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10" result="s"/>
      <feComponentTransfer in="s" result="s2"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <defs>
    <linearGradient id="ui" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="1020" y2="0">
      <stop offset="0"   stop-color="#3FB4FF"/>
      <stop offset="0.45" stop-color="#6A7CFF"/>
      <stop offset="0.8" stop-color="#C55CFF"/>
      <stop offset="1"   stop-color="#FF5DA5"/>
    </linearGradient>
  </defs>
  <rect width="1254" height="1254" fill="#0A0A0C"/>
  <g transform="translate(429 236) scale(0.58)">
  <g id="mark" clip-path="url(#clip)">
    <use href="#sil" fill="url(#base)"/>
    <!-- bottom ribbon: everything below the middle tick -->
    <path fill="url(#bot)" d="M0,525 C80,490 150,487 245,487 L720,487 L720,800 L-10,800 Z"/>
    <!-- fold back-face: a narrow crescent between the cyan's curled underside and the tick -->
    <path fill="url(#fold)" d="M245,220 C130,240 30,380 0,480 L0,525 C80,480 160,300 245,300 Z"/>
    <!-- top ribbon: straight underside, then curls under toward the vertex -->
    <g filter="url(#drop)">
      <path fill="url(#top)" d="M-10,-10 L720,-10 L720,220 L245,220 C130,240 30,380 0,480 L-10,480 Z"/>
    </g>
    <!-- middle tick: its own layer on top, stadium end, curling down to the vertex -->
    <g filter="url(#drop)">
      <path fill="url(#mid)" d="M245,300 L555,300 A92.5,92.5 0 0 1 555,485 L245,485 C150,487 80,490 0,525 C80,480 160,300 245,300 Z"/>
    </g>
  </g>
  </g>
  <text x="627" y="900" text-anchor="middle" font-family="Adwaita Sans, Inter, Fira Sans, sans-serif" font-weight="800" font-size="220" letter-spacing="-5" fill="#FFFFFF">Every<tspan fill="url(#ui)">UI</tspan></text>
  <text x="627" y="996" text-anchor="middle" font-family="Adwaita Sans, Inter, Fira Sans, sans-serif" font-weight="500" font-size="34" letter-spacing="9" fill="#B9BCC6">NATIVE UI FOR EVERY DEVICE</text>
</svg>
