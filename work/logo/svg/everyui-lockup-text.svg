<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="480" x2="700" y2="0">
      <stop offset="0"    stop-color="#4E6CFF"/>
      <stop offset="0.3"  stop-color="#3FAAFF"/>
      <stop offset="0.65" stop-color="#4AD9FF"/>
      <stop offset="1"    stop-color="#7DFFD6"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="245" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#151846"/>
      <stop offset="1" stop-color="#2F3399"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="650" y2="0">
      <stop offset="0"    stop-color="#3634A8"/>
      <stop offset="0.35" stop-color="#6A6BFF"/>
      <stop offset="0.75" stop-color="#B06CFF"/>
      <stop offset="1"    stop-color="#D274FF"/>
    </linearGradient>
    <linearGradient id="bot" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="700" y2="775">
      <stop offset="0"    stop-color="#8B4BFF"/>
      <stop offset="0.3"  stop-color="#FF5FA5"/>
      <stop offset="0.62" stop-color="#FF8A5C"/>
      <stop offset="1"    stop-color="#FFD84A"/>
    </linearGradient>
    <!-- soft drop shadow for the layers that overlap others -->
    <filter id="drop" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10" result="s"/>
      <feComponentTransfer in="s" result="s2"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- silhouette clip: shadows stay on the E's own surfaces, never in the slots or on the background -->
    <clipPath id="sil">
      <path d="M0,270 C0,121 121,0 270,0 L655,0 C680,0 700,20 700,45 C700,145 640,222 555,222 L245,222 C190,222 190,294 245,294 L555,294 A92.5,92.5 0 0 1 555,479 L245,479 C190,479 190,551 245,551 L535,551 C625,551 700,640 700,730 C700,755 680,775 655,775 L165,775 C74,775 0,701 0,610 Z"/>
    </clipPath>
  </defs>
  <defs>
    <linearGradient id="ui" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="1020" y2="0">
      <stop offset="0"   stop-color="#3FB4FF"/>
      <stop offset="0.45" stop-color="#6A7CFF"/>
      <stop offset="0.8" stop-color="#C55CFF"/>
      <stop offset="1"   stop-color="#FF5DA5"/>
    </linearGradient>
  </defs>
  <rect width="1254" height="1254" fill="#0A0A0C"/>
  <g transform="translate(429 236) scale(0.58)">
  <g id="mark" clip-path="url(#sil)">
    <!-- slots are both 72 tall: 222-294 and 479-551, with identical rounded ends -->
    <path fill="url(#bot)" d="M0,550 C50,510 140,481 245,479 C190,479 190,551 245,551 L535,551 C625,551 700,640 700,730 C700,755 680,775 655,775 L165,775 C74,775 0,701 0,610 Z"/>
    <!-- fold back-face, between the cyan underside and the tick's top edge -->
    <path fill="url(#fold)" d="M245,222 C140,228 20,365 0,430 L0,550 C15,470 160,305 245,294 Z"/>
    <!-- top ribbon: outer corner radius 270 -->
    <g filter="url(#drop)">
      <path fill="url(#top)" d="M0,270 C0,121 121,0 270,0 L655,0 C680,0 700,20 700,45 C700,145 640,222 555,222 L245,222 C140,228 20,365 0,430 Z"/>
    </g>
    <g filter="url(#drop)">
      <path fill="url(#mid)" d="M245,294 L555,294 A92.5,92.5 0 0 1 555,479 L245,479 C140,481 50,510 0,550 C15,470 160,305 245,294 Z"/>
    </g>
  </g>
  </g>
  <text x="627" y="900" text-anchor="middle" font-family="Adwaita Sans, Inter, Fira Sans, sans-serif" font-weight="800" font-size="220" letter-spacing="-5" fill="#FFFFFF">Every<tspan fill="url(#ui)">UI</tspan></text>
  <text x="627" y="996" text-anchor="middle" font-family="Adwaita Sans, Inter, Fira Sans, sans-serif" font-weight="500" font-size="34" letter-spacing="9" fill="#B9BCC6">NATIVE UI FOR EVERY DEVICE</text>
</svg>
